# Nginx Configuration for Production — Masjid Display
# Domain: https://masjid.alihdayahsiteba.web.id

server {
    listen 80;
    listen [::]:80;
    server_name masjid.alihdayahsiteba.web.id www.masjid.alihdayahsiteba.web.id;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name masjid.alihdayahsiteba.web.id www.masjid.alihdayahsiteba.web.id;
    root /var/www/masjid.alihdayahsiteba.web.id/public;

    # SSL Certificate Paths (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/masjid.alihdayahsiteba.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/masjid.alihdayahsiteba.web.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    index index.php index.html;
    charset utf-8;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }
}
